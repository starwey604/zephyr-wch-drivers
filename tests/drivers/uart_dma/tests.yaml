# SPDX-License-Identifier: Apache-2.0

common:
  tags:
    - drivers
    - uart
    - dma
    - wch
  platform_allow:
    - ragtime_gello/ch32v203
    - bluepillplus_ch32v203/ch32v203
  integration_platforms:
    - ragtime_gello/ch32v203
  harness: ztest
  build_only: true
tests:
  wch.uart_dma.rx_loopback:
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_WCH_UART_ASYNC_TX=y
      - CONFIG_WCH_UART_ASYNC_RX=y
  wch.uart_dma.tx:
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_WCH_UART_ASYNC_TX=y
  wch.uart_dma.scaffold.interrupt: {}
  wch.uart_dma.scaffold.polling:
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
